<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Register</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f5f6f8; margin: 0; padding: 40px; }
        .card { max-width: 420px; margin: 0 auto; background: #fff; padding: 24px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
        h1 { margin-top: 0; }
        label { display: block; margin-top: 12px; }
        input { width: 100%; padding: 8px; margin-top: 6px; box-sizing: border-box; }
        button { margin-top: 16px; padding: 10px 14px; width: 100%; background: #2c6bed; color: #fff; border: none; border-radius: 4px; cursor: pointer; }
        .flash { list-style: none; padding: 0; margin: 12px 0; }
        .flash li { background: #fff3cd; border: 1px solid #ffeeba; padding: 8px; border-radius: 4px; margin-bottom: 6px; }
        .links { margin-top: 16px; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Register</h1>

        {% with messages = get_flashed_messages() %}
            {% if messages %}
                <ul class="flash">
                    {% for message in messages %}
                        <li>{{ message }}</li>
                    {% endfor %}
                </ul>
            {% endif %}
        {% endwith %}

        <form method="post" action="{{ url_for('auth.register') }}">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required>

            <label for="password">Password</label>
            <input type="password" id="password" name="password" required>

            <label for="confirm">Confirm Password</label>
            <input type="password" id="confirm" name="confirm" required>

            <button type="submit">Create account</button>
        </form>

        <div class="links">
            <span>Already have an account?</span>
            <a href="{{ url_for('auth.login') }}">Login</a>
        </div>
    </div>
</body>
</html>
