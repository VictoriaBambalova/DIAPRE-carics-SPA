<!doctype html>
<html lang="bg">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ page_title or 'DIAPRE' }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
</head>
<body>
    <header class="topbar">
        <button class="icon-btn" id="menuBtn" aria-label="Open menu">&#9776;</button>
        <div class="brand">DIAPRE</div>
        <div class="topbar-actions">
            <a class="icon-btn" id="cartLink" href="/cart" data-spa="true" aria-label="Cart">&#128722;</a>
            <button class="icon-btn" id="searchBtn" aria-label="Search">&#128269;</button>
            <a class="icon-btn" id="profileLink" href="/auth" data-spa="true" aria-label="Profile">&#128100;</a>
        </div>
    </header>

    <nav class="sidebar" id="sidebar">
        <a href="/catalog" data-spa="true">Catalog</a>
        <a href="/profile" data-spa="true">Profile</a>
        <a href="/about" data-spa="true">About</a>
        <a href="/contacts" data-spa="true">Contacts</a>
    </nav>

    <div class="overlay" id="overlay"></div>

    <div class="search-bar" id="searchBar">
        <form id="searchForm">
            <input type="text" id="searchInput" placeholder="Search..." aria-label="Search">
            <button type="submit">Go</button>
        </form>
    </div>

    <div class="notice" id="notice" hidden></div>

    <main id="app"></main>

    <script type="module" src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
